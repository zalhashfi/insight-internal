name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # The iot-sim / ota-sim / widget-lab suites (D01–D03) live at the REPO ROOT and
  # are not run by the `collector` job above. Gate them too, so a regression in
  # src/iot-sim or src/widget-lab cannot ship green. These suites import only
  # `../src` and bun's built-ins, so no install is required.
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Test (root: iot-sim, ota-sim, widget-lab)"
        run: bun test
